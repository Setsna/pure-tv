plugins {
    id 'com.android.application'
}

// Per-TV settings that must never be committed live in launcher/local.properties (git-ignored):
//   weather.location=28.5983,77.1897,Chanakyapuri, New Delhi
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Pure TV's own id, so it installs alongside (not over) the upstream cleanyourtv launcher.
        // The Java package stays com.gathin.tvhome to keep the history with the original project.
        applicationId 'dev.vardxn.puretv'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '4.0.0'
        // Pinned weather location ("lat,lon,City"); empty = detect from the TV's internet connection.
        resValue 'string', 'weather_location', localProps.getProperty('weather.location', '')
    }

    // Release key lives outside the repo: set PURETV_STORE_FILE, PURETV_STORE_PASSWORD, PURETV_KEY_ALIAS
    // and PURETV_KEY_PASSWORD in ~/.gradle/gradle.properties. Without them (anyone building from source)
    // release builds fall back to the debug key so they still install.
    signingConfigs {
        release {
            if (project.hasProperty('PURETV_STORE_FILE')) {
                storeFile file(PURETV_STORE_FILE)
                storePassword PURETV_STORE_PASSWORD
                keyAlias PURETV_KEY_ALIAS
                keyPassword PURETV_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('PURETV_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
